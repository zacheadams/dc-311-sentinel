name: Scheduled 311 Sentinel Refresh

on:
  # schedule:
  #   - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache 2025-2026 raw Parquet files
        uses: actions/cache@v4
        with:
          path: data/raw
          key: dc-311-raw-parquet-v1-${{ github.run_id }}
          restore-keys: |
            dc-311-raw-parquet-v1-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run 311 Sentinel refresh pipeline
        run: python scripts/update_pipeline.py

      - name: Run verification test suite
        run: python -m unittest discover -s tests -v

      - name: Commit and push updated data and static site
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/*.geojson index.html emerging.html wards.html map.html tables.html
          if git diff --staged --quiet; then
            echo "No data or application changes detected."
          else
            git commit -m "Automated 311 Sentinel data refresh: $(date +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
