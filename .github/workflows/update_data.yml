name: Scheduled 311 Sentinel Refresh

on:
  # schedule:
  #   - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dc-311-sentinel-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Cache 2025-2026 raw Parquet files
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: data/raw
          key: dc-311-raw-parquet-v1-${{ hashFiles('scripts/fetch_311_data.py') }}
          restore-keys: |
            dc-311-raw-parquet-v1-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run 311 Sentinel refresh pipeline
        run: python scripts/update_pipeline.py

      - name: Run verification test suite
        run: python -m unittest discover -s tests -v

      - name: Commit and push updated data and static site
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/*.geojson index.html trends.html emerging.html wards.html map.html tables.html other.html
          if git diff --staged --quiet; then
            echo "No data or application changes detected."
          else
            git commit -m "Automated 311 Sentinel data refresh: $(date +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
